<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SkillSwap | Register</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page register-page">
<div class="register-shell">
  <a class="back-link" th:href="@{/login}">← Back to login</a>
  <main class="register-card">
    <div class="brand dark-brand"><span class="brand-icon">S</span> SkillSwap</div>
    <p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create your account</h1><p class="muted">A few details, then verify your student email.</p>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <form method="post" th:action="@{/register/send-otp}" class="form-grid">
      <div class="field wide"><label>Full name</label><input name="name" placeholder="Your name" minlength="2" maxlength="100" required></div>
      <div class="field"><label>Roll number (B.Tech)</label><input name="rollNumber" placeholder="e.g. 25BXXXXXX" minlength="9" maxlength="9" pattern="[A-Za-z0-9]{9}" required><small>9 letters/numbers for B.Tech testing.</small></div>
      <div class="field"><label>Official student email</label><input type="email" name="email" placeholder="name@student.nitw.ac.in" pattern=".+@student\.nitw\.ac\.in" required></div>
      <div class="field"><label>Branch</label><select name="branch" required><option value="">Choose branch</option><option>CSE</option><option>ECE</option><option>EEE</option><option>Mechanical</option><option>Civil</option><option>Chemical</option><option>Biotechnology</option><option>Metallurgical and Materials</option><option>Mathematics and Computing</option></select></div>
      <div class="field"><label>Year of study</label><select name="year" required><option value="">Choose year</option><option value="1">1st year</option><option value="2">2nd year</option><option value="3">3rd year</option><option value="4">4th year</option><option value="5">5th year</option><option value="6">6th year</option></select></div>
      <div class="field"><label>Course</label><select name="course" required><option value="">Choose course</option><option>B.Tech</option><option>M.Tech</option><option>M.Sc</option><option>MBA</option><option>Ph.D.</option></select></div>
      <div class="field"><label>Password</label><div class="password-wrap"><input id="newPassword" type="password" name="password" minlength="8" placeholder="At least 8 characters" required><button type="button" class="show-pass" onclick="togglePassword('newPassword',this)">Show</button></div></div>
      <div class="wide"><button class="primary-btn full" type="submit">Continue to email verification <span>→</span></button></div>
    </form>
    <p class="auth-switch">Already registered? <a th:href="@{/login}">Sign in</a></p>
  </main>
</div><script th:src="@{/js/app.js}"></script></body></html>
