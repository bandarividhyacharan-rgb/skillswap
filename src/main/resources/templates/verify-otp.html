<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify email | SkillSwap</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><div class="otp-card"><div class="brand dark-brand"><span class="brand-icon">S</span> SkillSwap</div><div class="otp-symbol">✉</div><p class="eyebrow">ONE LAST STEP</p><h1>Verify your email</h1><p class="muted" th:text="${message} ?: 'Enter the six-digit code to activate your account.'"></p><p class="email-chip" th:text="${email}"></p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/register/verify-otp}"><label>6-digit verification code</label><input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" class="otp-input" required><button class="primary-btn full" type="submit">Verify and create account →</button></form><p class="tiny-note">Code expires in 5 minutes. In local test mode, find the code in the server terminal.</p></div></body></html>
